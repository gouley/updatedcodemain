<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Portfolio - Raphaël COELHO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --blue: #4fc3f7;
            --blue-dark: #1976d2;
            --white: #fff;
            --transition: 0.4s cubic-bezier(.77,0,.18,1);
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--white);
            color: var(--blue-dark);
            min-height: 100vh;
            overflow: hidden;
        }
        /* Loader Styles */
        #loader {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity var(--transition);
        }
        .dots {
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .dot, .name-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--blue);
            opacity: 0.7;
            transform: translateX(-100vw);
            animation: slideDot 1.2s cubic-bezier(.77,0,.18,1) forwards;
        }
        .dot:nth-child(1) { animation-delay: 0.1s; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.5s; }
        .dot:nth-child(4) { animation-delay: 0.7s; }
        .dot:nth-child(5) { animation-delay: 0.9s; }
        .name-dot {
            background: var(--blue-dark);
            color: var(--white);
            font-weight: bold;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.02em;
            opacity: 1;
            animation: slideDot 1.2s cubic-bezier(.77,0,.18,1) forwards;
        }
        .name-dot:nth-child(2) { animation-delay: 0.3s; }
        .name-dot:nth-child(4) { animation-delay: 0.7s; }
        @keyframes slideDot {
            to { transform: translateX(0); }
        }
        #loader.hide {
            opacity: 0;
            pointer-events: none;
        }
        /* Portfolio Styles */
        #portfolio {
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 60px;
        }
        #portfolio.show {
            opacity: 1;
            pointer-events: auto;
            animation: fadeIn 1.2s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(40px);}
            to { opacity: 1; transform: translateY(0);}
        }
        .header {
            background: linear-gradient(90deg, var(--blue) 0%, var(--white) 100%);
            border-radius: 16px;
            padding: 32px 48px;
            box-shadow: 0 4px 24px rgba(79,195,247,0.08);
            margin-bottom: 32px;
            text-align: center;
            max-width: 600px;
        }
        .header h1 {
            margin: 0;
            font-size: 2.5rem;
            color: var(--blue-dark);
            letter-spacing: 0.04em;
        }
        .header p {
            margin: 12px 0 0 0;
            font-size: 1.2rem;
            color: #333;
        }
        /* Interactive Cards */
        .cards {
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 24px;
        }
        .card {
            background: var(--white);
            border: 2px solid var(--blue);
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(79,195,247,0.07);
            padding: 24px 32px;
            min-width: 220px;
            max-width: 320px;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .card:hover {
            transform: translateY(-8px) scale(1.04);
            box-shadow: 0 8px 32px rgba(79,195,247,0.15);
            border-color: var(--blue-dark);
        }
        .card-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--blue-dark);
            margin-bottom: 8px;
        }
        .card-desc {
            font-size: 1rem;
            color: #444;
        }
        /* Interactive Button */
        .btn {
            margin-top: 40px;
            padding: 14px 36px;
            background: var(--blue-dark);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            box-shadow: 0 2px 8px rgba(25,118,210,0.08);
        }
        .btn:hover {
            background: var(--blue);
            color: var(--blue-dark);
        }
        /* Responsive */
        @media (max-width: 600px) {
            .header { padding: 18px 12px; }
            .cards { gap: 16px; }
            .card { padding: 16px 10px; min-width: 160px; }
        }
    </style>
</head>
<body>
    <!-- Loader Animation -->
    <div id="loader">
        <div class="dots">
            <div class="dot"></div>
            <div class="name-dot">Raphaël</div>
            <div class="dot"></div>
            <div class="name-dot">COELHO</div>
            <div class="dot"></div>
        </div>
    </div>
    <!-- Portfolio Content -->
    <div id="portfolio">
        <div class="header">
            <h1>Raphaël COELHO</h1>
            <p>Développeur Web & Créatif</p>
        </div>
        <div class="cards">
            <div class="card" onclick="showDetails('projets')">
                <div class="card-title">Mes Projets</div>
                <div class="card-desc">Découvrez mes réalisations web, apps et plus.</div>
            </div>
            <div class="card" onclick="showDetails('competences')">
                <div class="card-title">Compétences</div>
                <div class="card-desc">HTML, CSS, JS, React, Node.js, UI/UX, etc.</div>
            </div>
            <div class="card" onclick="showDetails('contact')">
                <div class="card-title">Contact</div>
                <div class="card-desc">Envoyez-moi un message ou connectez-vous !</div>
            </div>
        </div>
        <button class="btn" onclick="interact()">En savoir plus</button>
    </div>
    <!-- Modal for Interactivity -->
    <div id="modal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(79,195,247,0.15); align-items:center; justify-content:center; z-index:10000;">
        <div style="background:white; border-radius:16px; padding:32px; box-shadow:0 8px 32px rgba(79,195,247,0.18); max-width:340px; text-align:center;">
            <div id="modal-content" style="font-size:1.1rem; color:#1976d2;"></div>
            <button onclick="closeModal()" class="btn" style="margin-top:24px;">Fermer</button>
        </div>
    </div>
    <script>
        // Loader Animation & Transition
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('loader').classList.add('hide');
                setTimeout(() => {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('portfolio').classList.add('show');
                    document.body.style.overflow = 'auto';
                }, 500);
            }, 2200); // Loader duration
        });

        // Interactive Cards
        function showDetails(type) {
            let content = '';
            if (type === 'projets') {
                content = "<b>Mes Projets</b><br>Portfolio, site e-commerce, applications JS, et plus. <br><a href='#' style='color:#4fc3f7;'>Voir les projets</a>";
            } else if (type === 'competences') {
                content = "<b>Compétences</b><br>HTML, CSS, JavaScript, React, Node.js, UI/UX, Figma, etc.";
            } else if (type === 'contact') {
                content = "<b>Contact</b><br>Email: raphael.coelho@email.com<br>LinkedIn: <a href='#' style='color:#4fc3f7;'>Profil</a>";
            }
            document.getElementById('modal-content').innerHTML = content;
            document.getElementById('modal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        // Button Interactivity
        function interact() {
            document.getElementById('modal-content').innerHTML = "<b>Bienvenue !</b><br>Ce portfolio est interactif.<br>Cliquez sur les cartes pour en savoir plus.";
            document.getElementById('modal').style.display = 'flex';
        }
        // Close modal on outside click
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
