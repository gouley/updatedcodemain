<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8"/>
            <title>Tank Arena</title>
                <style>
                    body{margin:0;background:linear-gradient(to bottom, #87CEEB, #98FB98);color:white;font-family:Arial;text-align:center}
                    canvas{background:#2F4F2F;display:block;margin:auto;border:5px solid #8B4513;box-shadow:0 0 20px rgba(0,0,0,0.5)}
                    #ui{position:fixed;top:10px;left:50%;transform:translateX(-50%)}
                    #upgrades{
                    display:flex;
                    flex-direction:column;
                    align-items:center;
                    }
                    #upgrades button{
                    margin:5px;
                    padding:10px;
                    width:200px;
                    text-align:center;
                    }
                </style>
    </head>
    <body>
        <div id="ui">
            <span id="stats"></span>
            <div id="upgrades" style="display:none">
            </div>
        </div>
        <canvas id="game" width="900" height="600"></canvas>
        <script>
                const canvas=document.getElementById('game')
                const ctx=canvas.getContext('2d')

                const keys={}
                let mouseX=0, mouseY=0

                document.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true)
                document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false)

                canvas.addEventListener('mousemove',e=>{
                const rect=canvas.getBoundingClientRect()
                mouseX=e.clientX - rect.left
                mouseY=e.clientY - rect.top
                })

                audioShoot=null

                const player={
                x:450,
                y:300,
                angle:0,
                speed:2,
                reload:400,
                damage:1,
                lastShot:0,
                size:18,
                kills:0,
                hp:10,
                maxHp:10,
                level:1,
                xp:0,
                upgrades:[],
                weaponMods:{laser:false, big:false, bounce:false, circle:false},
                bulletSize:1
                }

                const bullets=[]
                const bots=[]
                const obstacles=[]

                // Add some obstacles
                obstacles.push({x:200,y:200,w:100,h:20})
                obstacles.push({x:600,y:400,w:20,h:100})
                obstacles.push({x:300,y:100,w:150,h:20})
                obstacles.push({x:700,y:200,w:20,h:150})

                function spawnBot(){
                let x,y
                do{
                x=Math.random()*canvas.width
                y=Math.random()*canvas.height
                }while(checkCollision(x,y,16))
                bots.push({
                x:x,
                y:y,
                angle:0,
                speed:1.0,
                size:16,
                hp:3,
                lastShot:0,
                reload:800+Math.random()*400
                })
                }

                for(let i=0;i<5;i++)spawnBot()

                function shoot(){
                const now=Date.now()
                if(now-player.lastShot<player.reload)return
                player.lastShot=now
                if(player.weaponMods.laser) return; // continuous beam instead
                const baseBullet={
                x:player.x,
                y:player.y,
                angle:player.angle + (player.aimbot ? (Math.random()-0.5)*player.aimbot : 0),
                speed:player.weapon==='laser' ? 10 : (player.bulletRange || 6),
                damage:player.damage,
                type: player.weaponMods.laser ? 'laser' : player.weaponMods.big ? 'big' : player.weaponMods.bounce ? 'bounce' : player.weaponMods.circle ? 'circle' : 'normal',
                owner:'player'
                }

                if(player.doubleShot){
                bullets.push({...baseBullet, angle:baseBullet.angle - 0.1})
                bullets.push({...baseBullet, angle:baseBullet.angle + 0.1})
                }else{
                bullets.push(baseBullet)
                }

                if(player.randomShots){
                for(let i=0;i<2;i++){
                bullets.push({...baseBullet, angle:Math.random()*Math.PI*2})
                }
                }

                if(player.weapon==='circle'){
                for(let i=0;i<8;i++){
                bullets.push({...baseBullet, angle:baseBullet.angle + i*Math.PI/4, speed:4})
                }
                }
                }

                document.addEventListener('keydown',e=>{
                // no space here
                })

                function checkCollision(x,y,size){
                for(let obs of obstacles){
                if(x-size/2 < obs.x+obs.w && x+size/2 > obs.x && y-size/2 < obs.y+obs.h && y+size/2 > obs.y)return true
                }
                return false
                }

                function update(){

                player.angle = Math.atan2(mouseY - player.y, mouseX - player.x)

                let newX=player.x, newY=player.y
                if(keys['z']){
                newX+=Math.cos(player.angle)*player.speed
                newY+=Math.sin(player.angle)*player.speed
                }

                if(keys['s']){
                newX-=Math.cos(player.angle)*player.speed
                newY-=Math.sin(player.angle)*player.speed
                }

                if(!checkCollision(newX,newY,player.size)){
                player.x=newX
                player.y=newY
                }

                if(keys[' ']) shoot()

                if(player.weaponMods.laser && keys[' ']){
                // Continuous laser damage
                const dx = mouseX - player.x
                const dy = mouseY - player.y
                const dist = Math.hypot(dx,dy)
                if(dist > 0){
                const steps = Math.floor(dist / 5)
                for(let i=0; i<=steps; i++){
                const px = player.x + dx * i / steps
                const py = player.y + dy * i / steps
                bots.forEach((bot,bi)=>{
                if(Math.hypot(px - bot.x, py - bot.y) < bot.size){
                bot.hp -= player.damage * 0.05 // small continuous damage
                if(bot.hp<=0){
                player.kills++
                player.xp++
                bots.splice(bi,1)
                spawnBot()
                if(player.xp>=5){
                player.xp=0
                player.level++
                showUpgrade()
                }
                }
                }
                })
                }
                }
                }

                bullets.forEach((b,i)=>{
                let newX=b.x+Math.cos(b.angle)*b.speed
                let newY=b.y+Math.sin(b.angle)*b.speed

                if(checkCollision(newX,newY,2)){
                if(b.type==='bounce'){
                b.angle += Math.PI + (Math.random()-0.5)*0.5 // reverse and slight random
                }else{
                bullets.splice(i,1)
                return
                }
                }

                b.x=newX
                b.y=newY

                bots.forEach((bot,bi)=>{
                const dx=b.x-bot.x
                const dy=b.y-bot.y
                if(Math.hypot(dx,dy)<bot.size && b.owner !== 'bot'){

                bot.hp-=b.damage || 1
                bullets.splice(i,1)
                if(bot.hp<=0){
                player.kills++
                player.xp++
                bots.splice(bi,1)
                spawnBot()
                if(player.xp>=5){
                player.xp=0
                player.level++
                showUpgrade()
                }
                }
                }
                })

                // Check if bullet hits player
                const dxp=b.x-player.x
                const dyp=b.y-player.y
                if(Math.hypot(dxp,dyp)<player.size && b.owner !== 'player'){
                let dmg = b.damage || 1
                if(player.defense)dmg *= (1 - player.defense)
                player.hp -= dmg
                bullets.splice(i,1)
                if(player.hp<=0){
                player.hp=player.maxHp
                }
                }
                })

                bots.forEach(bot=>{
                const dx=player.x-bot.x
                const dy=player.y-bot.y
                const dist=Math.hypot(dx,dy)

                bot.angle = Math.atan2(dy,dx)

                // Try to move towards player, but avoid obstacles
                let newX=bot.x + Math.cos(bot.angle)*bot.speed
                let newY=bot.y + Math.sin(bot.angle)*bot.speed

                if(!checkCollision(newX,newY,bot.size)){
                bot.x=newX
                bot.y=newY
                }

                // Shoot at player if close
                if(dist<200){
                const now=Date.now()
                if(now-bot.lastShot>bot.reload){
                bot.lastShot=now
                bullets.push({
                x:bot.x,
                y:bot.y,
                angle:bot.angle,
                speed:4,
                damage:1,
                type:'normal',
                owner:'bot'
                })
                }
                }
                })
                }

                function drawTank(x,y,angle,color,size,hp,maxHp){
                ctx.save()
                ctx.translate(x,y)
                ctx.rotate(angle)

                // Shadow
                ctx.fillStyle='rgba(0,0,0,0.3)'
                ctx.fillRect(-size/2 + 2, -size/2 + 2, size, size)

                // Tank body with gradient
                let grad = ctx.createLinearGradient(-size/2, -size/2, size/2, size/2)
                grad.addColorStop(0, color)
                grad.addColorStop(1, '#000')
                ctx.fillStyle=grad
                ctx.fillRect(-size/2,-size/2,size,size)

                // Turret
                ctx.fillStyle='#666'
                ctx.beginPath()
                ctx.arc(0, -size/4, size/3, 0, Math.PI*2)
                ctx.fill()

                // Barrel
                ctx.strokeStyle='#333'
                ctx.lineWidth=4
                ctx.beginPath()
                ctx.moveTo(0, -size/4)
                ctx.lineTo(size/2 + 10, -size/4)
                ctx.stroke()

                // Tracks
                ctx.strokeStyle='#222'
                ctx.lineWidth=3
                ctx.beginPath()
                ctx.moveTo(-size/2, -size/2)
                ctx.lineTo(-size/2, size/2)
                ctx.moveTo(size/2, -size/2)
                ctx.lineTo(size/2, size/2)
                ctx.stroke()

                // HP bar
                if(maxHp){
                ctx.fillStyle='red'
                ctx.fillRect(-size/2,-size/2-18,size,8)
                ctx.fillStyle='green'
                ctx.fillRect(-size/2,-size/2-18,size*(hp/maxHp),8)
                }
                ctx.restore()
                }

                function draw(){
                ctx.clearRect(0,0,canvas.width,canvas.height)

                // Draw obstacles
                ctx.fillStyle='#8B4513'
                obstacles.forEach(obs=>{
                ctx.fillRect(obs.x,obs.y,obs.w,obs.h)
                // Add some texture
                ctx.fillStyle='#A0522D'
                ctx.fillRect(obs.x+2,obs.y+2,obs.w-4,obs.h-4)
                ctx.fillStyle='#8B4513'
                })

                drawTank(player.x,player.y,player.angle,'#3cff5c',player.size,player.hp,player.maxHp)

                bots.forEach(bot=>drawTank(bot.x,bot.y,bot.angle,'#ff4c4c',bot.size,bot.hp,3))

                ctx.fillStyle='yellow'
                bullets.forEach(b=>{
                let size=4
                let color='yellow'
                if(b.type==='big'){size=6 * player.bulletSize; color='orange'}
                else if(b.type==='laser'){
                // Draw laser as a line
                ctx.strokeStyle='red'
                ctx.lineWidth=3
                ctx.beginPath()
                ctx.moveTo(b.x, b.y)
                ctx.lineTo(b.x + Math.cos(b.angle)*20, b.y + Math.sin(b.angle)*20) // short beam
                ctx.stroke()
                return
                }
                else if(b.type==='bounce'){color='blue'}
                ctx.fillStyle=color
                ctx.fillRect(b.x-size/2,b.y-size/2,size,size)
                })

                // Draw crosshair
                ctx.strokeStyle='white'
                ctx.lineWidth=1
                ctx.beginPath()
                ctx.moveTo(mouseX-10, mouseY)
                ctx.lineTo(mouseX+10, mouseY)
                ctx.moveTo(mouseX, mouseY-10)
                ctx.lineTo(mouseX, mouseY+10)
                ctx.stroke()

                // Draw laser beam if active
                if(player.weaponMods.laser && keys[' ']){
                ctx.strokeStyle='red'
                ctx.lineWidth=5
                ctx.shadowColor='red'
                ctx.shadowBlur=10
                ctx.beginPath()
                ctx.moveTo(player.x, player.y)
                ctx.lineTo(mouseX, mouseY)
                ctx.stroke()
                ctx.shadowBlur=0 // reset
                }

                }

                let paused = false

                function loop(){
                if(!paused){
                update()
                draw()
                }

                document.getElementById('stats').innerText=
                `Kills: ${player.kills} | Level: ${player.level} | HP: ${player.hp}/${player.maxHp} | Vitesse: ${player.speed.toFixed(1)} | Recharge: ${player.reload}`

                requestAnimationFrame(loop)
                }

                const cardTypes=[
                {name:'Vitesse',desc:'Augmente la vitesse',icon:'👟',effect:()=>player.speed+=0.4},
                {name:'Dégâts',desc:'Augmente les dégâts',icon:'⚔️',effect:()=>player.damage+=1},
                {name:'Défense',desc:'Ajoute des PV',icon:'🛡️',effect:()=>{player.maxHp+=5;player.hp+=5}},
                {name:'Réduction Dégâts',desc:'Réduit les dégâts reçus de 10%',icon:'🔒',effect:()=>{player.defense = (player.defense||0)+0.1}},
                {name:'Tirs Doubles',desc:'Tire deux balles',icon:'🔫',effect:()=>{player.doubleShot=true}},
                {name:'Tirs Aléatoires',desc:'Tire deux balles supplémentaires aléatoirement',icon:'🎲',effect:()=>{player.randomShots=true}},
                {name:'Laser',desc:'Change l\'arme en laser',icon:'🔴',effect:()=>{player.weaponMods.laser=true}},
                {name:'Grosses Balles',desc:'Balles plus grosses',icon:'💥',effect:()=>{player.weaponMods.big=true; player.bulletSize *= 1.15}},
                {name:'Ricochets',desc:'Balles ricochent sur les murs',icon:'🏓',effect:()=>{player.weaponMods.bounce=true}},
                {name:'Portée',desc:'Augmente la portée des balles',icon:'📏',effect:()=>{player.bulletRange = (player.bulletRange||6)+2}},
                {name:'Cercle de Lumière',desc:'Tire un cercle de lumière',icon:'🌟',effect:()=>{player.weaponMods.circle=true}},
                {name:'Aimbot',desc:'15% d\'aide à la visée',icon:'🎯',effect:()=>{player.aimbot = (player.aimbot||0)+0.15}}
                ]

                function showUpgrade(){
                paused = true
                const available = cardTypes // remove filter to allow multiples
                if(available.length<3)return // not enough cards

                const selected=[]
                while(selected.length<3){
                const rand = available[Math.floor(Math.random()*available.length)]
                selected.push(rand) // allow duplicates
                }

                document.getElementById('upgrades').innerHTML='<p>Choisissez une amélioration :</p>'
                selected.forEach(card=>{
                const btn=document.createElement('button')
                btn.innerHTML=`${card.icon} ${card.name}<br>${card.desc}`
                btn.onclick=()=>{
                upgrade(card)
                }
                document.getElementById('upgrades').appendChild(btn)
                })
                document.getElementById('upgrades').style.display='block'
                }

                function upgrade(card){
                card.effect()
                player.upgrades.push(card.name)
                document.getElementById('upgrades').style.display='none'
                paused = false
                }

                loop()
        </script>
    </body>
</html>
