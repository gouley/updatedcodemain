<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dépot de candidature</title>
</head>
<body>
    <H1>Dépôt de candidature</H1>
    <label for="annonce">Catégorie annonce: </label>
    <select name="annonce" id="2">
    <option value="Selection">--Sélectionnez--</option>
    <option value="animation">Animation</option>
    <option value="benevolat">Bénévolat</option>
    <option value="garde">Garde enfant</option>
    <option value="soutien">Soutien Scolaire</option>
    <option value="stage">Stages</option>
    <option value="autre">Autre</option>
    </select>
    <br><br>

        <form method="post" actiion="" name="Identité" >
            <fieldset>
                    <legend>Identité</legend>
                <input type="radio" name="civilité" id="mme" value="Mme">
                <label for="mme">Madame</label>
                <input type="radio" name="civilité" id="mr" value="Mr">
                <label for="mr">Monsieur</label>
                <p>
                    <label for="nom">Votre nom : </label>
                    <input type="text" name="nom" id="nom">
                </p>
                <p>
                    <label for="prénom">Votre prénom : </label>
                    <input type="text" name="prénom" id="prénom">
                </p>
                <label for="age">Âge : </label>
                <input type="number" min="18" max="30" name="age" id="age">
                <br><br>
                <label for="DOB">Date de naissance : </label>
                <input type="date" name="DOB" id="DOB">
            </fieldset>
            <fieldset>
                <legend>Coordonées</legend>
                <label for="tele">Téléphone</label>
                <input type="text" name="tele" id="tele">
                <br><br>
                <label for="addr">Adresse mail : </label>
                <input type="email" name="addr" id="addr">
                <br><br>
                Permis de conduire : 
                <input type="radio" name="tsaitconduiroupas" id="ui" value="ui">
                <label for="ui">Oui</label>
                <input type="radio" name="tsaitconduiroupas" id="non" value="non">
                <label for="non">Non</label>
            </fieldset>
            <fieldset>
                <legend>Statut</legend>
                <input type="radio" name="statut" id="etudiant" value="etudiant">
                <label for="etudiant">Etudiant</label>
                <input type="radio" name="statut" id="chomeur" value="chomeur">
                <label for="chomeur">Demandeur D'emploi</label>
                <input type="radio" name="statut" id="taffeur" value="taffeur">
                <label for="taffeur">Travailleur</label>
            </fieldset>
            <fieldset>
                <legend>Diplômes</legend>
                <label for="Diplômes">Niveau D'étude</label>
                <select name="Diplômes" id="3">
                    <option value="Selection">--Sélectionnez--</option>
                    <option value="brevet">Diplôme national du brevet</option>
                    <option value="cap">CAP</option>
                    <option value="bep">BEP</option>
                    <option value="bac">BAC</option>
                    <option value="bts">BTS</option>
                    <option value="liscence">Liscence</option>
                    <option value="master">Master</option>
                    <option value="doctorat">Doctorat</option>
                </select>
                <br><br>
                <label for="last">Dernier Diplôme obtenu</label>
                <input type="text" name="last" id="last">
                <br><br>
                Autre(s) certificat(s) / diplôme(s) <br>
                <input type="checkbox" name="bafa" id="bafa">
                <label for="bafa">BAFA</label>
                <input type="checkbox" name="bafd" id="bafd">
                <label for="bafd">BAFD</label>
                <input type="checkbox" name="bnssa" id="bnssa">
                <label for="bnssa">BNSSA</label>
            </fieldset>
            <fieldset>
                <legend>Disponibilité</legend>
                <input type="checkbox" name="day" id="day">
                <label for="day">Journée</label>
                <input type="checkbox" name="night" id="night">
                <label for="night">Soirée</label>
                <input type="checkbox" name="weekend" id="weekend">
                <label for="weekend">Week End</label>
                <input type="checkbox" name="ptvs" id="ptvs">
                <label for="ptvs">Petites vacances Scolaires</label>
                <input type="checkbox" name="bvs" id="bvs">
                <label for="bvs">Grandes vacances Scolaires</label>
                <input type="checkbox" name="other" id="other">
                <label for="other">Autres</label>
                <br><br>
                A préciser : 
                <input type="text" name="precis" id="precis">
                <br><br>
            </fieldset>
            <br>
            Text Libre : <br>
            <textarea name="Comm" id="Comm" placeholder="Ajoutez votres/ vos commentaire(s)" cols="100" rows="10"></textarea>
            <p>
                <input type="submit" value="Envoyer">
                <input type="reset" value="Reset">
            </p>
        </form> 

</body>
</html>
